<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Availability</title>
<style>
  :root {
    --bg: #fafaf8;
    --card: #ffffff;
    --text: #1f2328;
    --muted: #6b7280;
    --line: #e5e7eb;
    --free: #dff3e4;
    --free-text: #1d6b34;
    --held: #fdf0c8;
    --held-text: #8a5d00;
    --booked: #f6d6d6;
    --booked-text: #9b2c2c;
    --today: #1f2328;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181b;
      --card: #1e2125;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --line: #2e3238;
      --free: #1e3a28;
      --free-text: #8fd6a4;
      --held: #473a14;
      --held-text: #f0cd72;
      --booked: #4a2326;
      --booked-text: #f0a3a3;
      --today: #e8eaed;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 48px;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.4;
  }
  .wrap { max-width: 620px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: 0.95rem; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 16px;
  }
  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }
  .nav h2 { font-size: 1.1rem; margin: 0; }
  .nav button {
    background: none;
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 8px;
    width: 38px;
    height: 38px;
    font-size: 1.1rem;
    cursor: pointer;
  }
  .nav button:hover:not(:disabled) { background: var(--bg); }
  .nav button:disabled { opacity: 0.3; cursor: default; }

  .grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }
  .dow {
    text-align: center;
    font-size: 0.75rem;
    color: var(--muted);
    padding-bottom: 4px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .day {
    aspect-ratio: 1 / 1;
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 0.95rem;
    position: relative;
  }
  .day.empty { visibility: hidden; }
  .day .label { font-size: 0.62rem; margin-top: 2px; font-weight: 600; letter-spacing: 0.02em; }
  .day.free   { background: var(--free);   color: var(--free-text); }
  .day.held   { background: var(--held);   color: var(--held-text); }
  .day.booked { background: var(--booked); color: var(--booked-text); }
  .day.past   { opacity: 0.35; }
  .day.today  { outline: 2px solid var(--today); outline-offset: 1px; }

  .legend {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 18px;
    margin-top: 16px;
    font-size: 0.85rem;
    color: var(--muted);
  }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
  .swatch.free { background: var(--free); border: 1px solid var(--free-text); }
  .swatch.held { background: var(--held); border: 1px solid var(--held-text); }
  .swatch.booked { background: var(--booked); border: 1px solid var(--booked-text); }

  .msg { margin-top: 14px; font-size: 0.85rem; color: var(--muted); }
  .error { color: var(--booked-text); }
  .updated { margin-top: 14px; font-size: 0.8rem; color: var(--muted); }

  @media (max-width: 420px) {
    .day .label { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>Availability</h1>
  <p class="sub">Check which dates are open for freelance work.</p>

  <div class="card">
    <div class="nav">
      <button id="prev" aria-label="Previous month">&#8249;</button>
      <h2 id="title"></h2>
      <button id="next" aria-label="Next month">&#8250;</button>
    </div>
    <div class="grid" id="grid"></div>

    <div class="legend">
      <span><i class="swatch free"></i> Available</span>
      <span><i class="swatch held"></i> Held / pencilled in</span>
      <span><i class="swatch booked"></i> Booked / unavailable</span>
    </div>
    <div class="msg" id="msg"></div>
  </div>
</div>

<script>
(function () {
  // ---- Settings you may want to change ----
  var DATA_URL = "availability.json"; // path to your data file
  var MONTHS_AHEAD = 18;              // how far ahead clients can browse
  var WEEK_STARTS_ON_MONDAY = true;   // set false for Sunday start
  var MARK_WEEKENDS_AS_FREE = true;   // true = weekends look like any other free day
  // -----------------------------------------

  var MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
  var DOW = WEEK_STARTS_ON_MONDAY
    ? ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"]
    : ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

  var today = new Date();
  today.setHours(0, 0, 0, 0);
  var minMonth = new Date(today.getFullYear(), today.getMonth(), 1);
  var maxMonth = new Date(today.getFullYear(), today.getMonth() + MONTHS_AHEAD, 1);
  var view = new Date(minMonth);

  var singles = {};   // "YYYY-MM-DD" -> status
  var ranges = [];    // {start, end, status}

  var gridEl = document.getElementById("grid");
  var titleEl = document.getElementById("title");
  var msgEl = document.getElementById("msg");
  var prevBtn = document.getElementById("prev");
  var nextBtn = document.getElementById("next");

  function pad(n) { return n < 10 ? "0" + n : "" + n; }
  function key(y, m, d) { return y + "-" + pad(m + 1) + "-" + pad(d); }

  function normalizeStatus(s) {
    s = String(s || "").toLowerCase().trim();
    if (s === "held" || s === "hold" || s === "pencilled") return "held";
    if (s === "confirmed" || s === "booked" || s === "busy") return "booked";
    return "free";
  }

  function parseData(data) {
    singles = {};
    ranges = [];
    Object.keys(data).forEach(function (k) {
      if (k.charAt(0) === "_") return; // ignore notes like "_note"
      var status = normalizeStatus(data[k]);
      if (k.indexOf("/") !== -1) {
        var parts = k.split("/");
        ranges.push({ start: parts[0].trim(), end: parts[1].trim(), status: status });
      } else {
        singles[k.trim()] = status;
      }
    });
  }

  function statusFor(dateKey) {
    if (singles.hasOwnProperty(dateKey)) return singles[dateKey];
    // ISO date strings compare correctly as text
    var result = "free";
    for (var i = 0; i < ranges.length; i++) {
      var r = ranges[i];
      if (dateKey >= r.start && dateKey <= r.end) {
        // if ranges overlap, "booked" wins over "held"
        if (r.status === "booked") return "booked";
        result = r.status;
      }
    }
    return result;
  }

  function render() {
    var y = view.getFullYear();
    var m = view.getMonth();
    titleEl.textContent = MONTH_NAMES[m] + " " + y;
    gridEl.innerHTML = "";

    DOW.forEach(function (d) {
      var el = document.createElement("div");
      el.className = "dow";
      el.textContent = d;
      gridEl.appendChild(el);
    });

    var first = new Date(y, m, 1);
    var offset = WEEK_STARTS_ON_MONDAY ? (first.getDay() + 6) % 7 : first.getDay();
    var daysInMonth = new Date(y, m + 1, 0).getDate();

    for (var i = 0; i < offset; i++) {
      var blank = document.createElement("div");
      blank.className = "day empty";
      gridEl.appendChild(blank);
    }

    for (var d = 1; d <= daysInMonth; d++) {
      var date = new Date(y, m, d);
      var st = statusFor(key(y, m, d));
      var el = document.createElement("div");
      el.className = "day " + st;
      if (date < today) el.className += " past";
      if (date.getTime() === today.getTime()) el.className += " today";

      var label = st === "held" ? "Held" : st === "booked" ? "Booked" : "";
      el.setAttribute("title", st === "free" ? "Available" : st === "held" ? "Held" : "Booked");

      var num = document.createElement("span");
      num.textContent = d;
      el.appendChild(num);

      if (label) {
        var lab = document.createElement("span");
        lab.className = "label";
        lab.textContent = label;
        el.appendChild(lab);
      }
      gridEl.appendChild(el);
    }

    prevBtn.disabled = view <= minMonth;
    nextBtn.disabled = view >= maxMonth;
  }

  prevBtn.addEventListener("click", function () {
    view = new Date(view.getFullYear(), view.getMonth() - 1, 1);
    render();
  });
  nextBtn.addEventListener("click", function () {
    view = new Date(view.getFullYear(), view.getMonth() + 1, 1);
    render();
  });

  // Load data (cache-busted so updates show up right away)
  fetch(DATA_URL + "?t=" + Date.now())
    .then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json();
    })
    .then(function (data) {
      parseData(data);
      render();
    })
    .catch(function () {
      render();
      msgEl.className = "msg error";
      msgEl.textContent = "Couldn't load availability data. If you're previewing this file locally, " +
        "browsers block loading the data file; run a local server or view it on the live site.";
    });
})();
</script>
</body>
</html>
